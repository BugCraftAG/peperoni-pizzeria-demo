# Start:   docker compose up -d --build
# Logs:    docker compose logs -f
# Website: http://localhost:8080
services:
  peperoni:
    build: .
    image: peperoni-server:latest
    container_name: peperoni
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite:///data/peperoni.db
      # Empfänger der Bestellungen (WhatsApp). Vor dem Livegang auf die Nummer der Pizzeria ändern.
      WHATSAPP_TARGET: ${WHATSAPP_TARGET:-+436645112794}
      # true = Demo: Bestellungen auch außerhalb der Öffnungszeiten möglich
      PEPERONI_DEMO: ${PEPERONI_DEMO:-true}
      # hinter HTTPS (z. B. Caddy/Traefik) auf true setzen
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # optional: Bestellungen zusätzlich automatisch per WhatsApp schicken (CallMeBot)
      CALLMEBOT_PHONE: ${CALLMEBOT_PHONE:-}
      CALLMEBOT_APIKEY: ${CALLMEBOT_APIKEY:-}
      # optional: GET /api/admin/orders mit "Authorization: Bearer <Token>" (mind. 16 Zeichen)
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - peperoni-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  peperoni-data:
